name: Verify Windows and Android
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python tools/audit_public_source.py
      - run: python -m unittest tests.test_public_source_audit -v
      - name: Secret scan (verified Gitleaks, source directory only)
        env:
          AUDIT_TOOL_DIR: ${{ runner.temp }}/mastixa-gitleaks
        run: |
          mkdir -p "$AUDIT_TOOL_DIR"
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$AUDIT_TOOL_DIR/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$AUDIT_TOOL_DIR/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$AUDIT_TOOL_DIR/gitleaks.tar.gz" -C "$AUDIT_TOOL_DIR" gitleaks
          "$AUDIT_TOOL_DIR/gitleaks" dir . --config .gitleaks.toml --redact --no-banner --max-archive-depth 2 --max-decode-depth 3
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - name: Install source-test dependencies
        run: python -m pip install -r requirements-dev.txt -c requirements-windows-rc.txt
      - name: Windows tests
        env:
          MASTIXA_DATA_HOME: ${{ runner.temp }}\mastixa-tests-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          python tools/run_windows_tests.py --jobs 2 --timeout 120
          --module-timeout tests.test_activity_expense_sync=240
          --module-timeout tests.test_phase16j_composed_ui_localization=180
          --module-timeout tests.test_sale_sources=360
          --module-timeout tests.test_stabilization=360
      - name: Development packaging and legal contracts (release remains blocked)
        if: ${{ !cancelled() }}
        run: >-
          python -m unittest
          tests.test_windows_rc_release.WindowsRcReleaseTests.test_development_metadata_cannot_build_with_retained_stable_configuration
          tests.test_windows_rc_release.WindowsRcReleaseTests.test_preflight_refuses_incomplete_native_legal_and_source_delivery
          -v
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Install SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Android build, lint and test APK compilation
        working-directory: android
        run: bash ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleChecksAndroidTest --console=plain
